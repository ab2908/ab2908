# GitHub Action to generate self-hosted stats/top-langs/pin cards.
# Replaces the third-party github-readme-stats mirror, which breaks whenever
# its shared API token gets rate limited by GitHub.
name: Generate Stats Cards

on:
  # Run automatically once a day
  schedule:
    - cron: "0 6 * * *"

  # Also allow manual trigger
  workflow_dispatch:

  # Re-run when the generator itself changes
  push:
    branches:
      - main
    paths:
      - .github/workflows/stats.yml
      - .github/scripts/generate_stats.py

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats SVGs
        run: python .github/scripts/generate_stats.py
        env:
          GH_USERNAME: ab2908
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the generated files to their own output branch (kept separate
      # from the snake animation's "output" branch, since this action
      # replaces the whole target branch with build_dir on every run).
      - name: Push to stats-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
